name: Legion
description: A comprehensive project management and analysis tool with advanced features for code analysis, project tracking, and development workflow optimization.
language: kotlin
tags:
  - kotlin
  - project-management
  - code-analysis
  - cli
  - development-tools
  - workflow-optimization

release_branch: develop
has_release_script: true
release_repo: patbeagan1/Legion

subtree:
  repo: git@github.com:patbeagan1/Legion.git
  prefix: Legion
  branch: develop

scripts:
  build:
    command: ./gradlew build
  test:
    command: ./gradlew test
  run:
    command: ./gradlew run

