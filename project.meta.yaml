name: Legion
description: |
  Legion is a powerful Kotlin library for building and executing asynchronous, type-safe task graphs. 
  Inspired by Flow-Based Programming (FBP), Legion enables you to define complex workflows as 
  a network of independent, reusable processing nodes. It emphasizes type safety, 
  asynchronicity with coroutines, and a flexible DSL for graph definition. 
  Legion supports advanced features such as forks, joins, stateful nodes, 
  control flow, inter-node communication, CLI integration, and graph visualization.
language: kotlin
tags:
  - kotlin
  - library
  - task-graph
  - flow-based-programming
  - asynchronous
  - typesafe
  - dsl
  - cli
  - workflow
  - graphviz
  - coroutines

release_branch: develop
has_release_script: true
release_repo: patbeagan1/Legion

subtree:
  repo: git@github.com:patbeagan1/Legion.git
  prefix: Legion
  branch: develop

scripts:
  build:
    command: ./gradlew build
  test:
    command: ./gradlew test
  run:
    command: ./gradlew run

